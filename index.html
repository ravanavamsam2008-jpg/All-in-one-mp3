<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All In One MP3 Generator - By Sada</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .author {
            color: #fbbf24;
            font-size: 14px;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 14px;
            margin-bottom: 15px;
        }
        button {
            background-color: #a855f7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background-color: #9333ea;
        }
        .msg {
            margin-top: 15px;
            color: #4ade80;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 ALL IN ONE MP3 GENERATOR 🎵</h1>
        <div class="author">BY SADAUESAN</div>
        
        <form action="/download" method="POST">
            <input type="text" name="url" placeholder="Enter your YouTube / Insta URL..." required>
            <br>
            <button type="submit">Download MP3</button>
        </form>

        {% if message %}
            <div class="msg">{{ message }}</div>
        {% endif %}
    </div>
</body>
</html>
